name: Bug report
description: Report reproducible incorrect Q-Seed behavior
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here. Follow SECURITY.md.
  - type: input
    id: revision
    attributes:
      label: Q-Seed revision
      description: Commit or release where the problem occurs.
    validations:
      required: true
  - type: input
    id: framework_revision
    attributes:
      label: Qwen framework revision
      description: Run `git -C qwen-code rev-parse HEAD`.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened, including relevant output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest safe sequence that reproduces the issue.
    validations:
      required: true
  - type: dropdown
    id: compartment
    attributes:
      label: Suspected compartment
      options:
        - Unknown
        - Qwen framework
        - Cognitive/plugin brain
        - Job experience
        - Cross-layer interaction
    validations:
      required: true
